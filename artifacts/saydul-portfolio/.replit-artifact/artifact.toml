kind = "web"
previewPath = "/"
title = "Automexa — Digital Systems & Automation"
description = "Automexa is Saydul Haque Sayeed’s digital systems and automation practice, helping ambitious small businesses connect AI automation, websites, CRM systems, apps, design, and content."
version = "1.0.0"
id = "artifacts/saydul-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25260

[services.development]
run = "pnpm --filter @workspace/saydul-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/saydul-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/saydul-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25260"
BASE_PATH = "/"
